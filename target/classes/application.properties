spring.application.name=AssetTracker
spring.data.mongodb.auto-index-creation=true
server.port=8082

# Dynamic URI with fallback defaults (syntax: ${ENV_VAR:default_value})
spring.data.mongodb.uri=mongodb://${MONGO_USER:desk_user}:${MONGO_PASS:DeskPassword123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:support_desk_db}?authSource=${MONGO_DB:support_desk_db}